[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-automation-toolkit"
version = "0.1.0"
description = "CLI toolkit for IOC lookup, log triage, and alert enrichment/reporting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
soc-toolkit = "soc_automation_toolkit:main"

[tool.setuptools]
package-dir = { "" = "soc_automation_toolkit" }
py-modules = [
    "soc_automation_toolkit",
    "config",
    "ioc_lookup",
    "log_parser",
    "rules",
    "enrichment",
    "report",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["soc_automation_toolkit/tests"]

[tool.coverage.run]
omit = ["*/tests/*"]
